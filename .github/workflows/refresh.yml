name: Refresh GTM Radar

on:
  schedule:
    - cron: "47 12 * * *"   # ~5:47am Pacific
    - cron: "41 13 * * *"   # ~6:41am Pacific (backup)
    - cron: "53 14 * * *"   # ~7:53am Pacific (backup)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pull jobs from public hiring feeds
        run: python radar.py
      - name: Commit updated data
        run: |
          git config user.name  "gtm-radar-bot"
          git config user.email "gtm-radar-bot@users.noreply.github.com"
          git add docs/jobs.json data/seen.json companies.csv
          git diff --cached --quiet || git commit -m "Refresh jobs $(date -u +%F)"
          git pull --rebase -X theirs origin main
          git push origin HEAD:main
