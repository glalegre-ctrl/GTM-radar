<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>GTM Radar</title>
<style>
  :root {
    --bg: #f7f7f5; --card: #ffffff; --ink: #1d1d1b; --muted: #6b6b66; --line: #e3e2dd;
    --accent: #0f5c4d; --accent-soft: #e2efe9; --new: #b4471b;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151514; --card: #1f1f1d; --ink: #ecebe6; --muted: #a09f98; --line: #34332f;
            --accent: #6cc3ab; --accent-soft: #1f3a33; --new: #f08a5d; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font-family: Arial, Helvetica, sans-serif; font-size: 15px; line-height: 1.45; }
  header, main { max-width: 1040px; margin: 0 auto; padding: 0 16px; }
  header { padding-top: 28px; padding-bottom: 8px; }
  h1 { font-size: 24px; margin: 0 0 4px; letter-spacing: -0.01em; }
  .sub { color: var(--muted); margin: 0; font-size: 14px; }
  .filters { background: var(--card); border: 1px solid var(--line); border-radius: 10px;
             padding: 14px 16px; margin: 16px 0; display: grid; gap: 10px; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .row > .label { width: 92px; color: var(--muted); font-size: 13px; flex-shrink: 0; }
  .row > span[id] { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { border: 1px solid var(--line); background: transparent; color: var(--ink);
          border-radius: 999px; padding: 5px 12px; font: inherit; font-size: 13px; cursor: pointer; }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--card); }
  input[type=search] { flex: 1; min-width: 180px; padding: 7px 10px; border: 1px solid var(--line);
                       border-radius: 8px; background: var(--bg); color: var(--ink); font: inherit; }
  .summary { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px;
             color: var(--muted); font-size: 13px; margin: 4px 0 10px; }
  .list { display: grid; gap: 8px; margin-bottom: 40px; }
  .job { background: var(--card); border: 1px solid var(--line); border-radius: 10px;
         padding: 12px 16px; display: grid; grid-template-columns: 1fr auto; gap: 4px 16px; }
  .job a { color: var(--ink); text-decoration: none; font-weight: bold; }
  .job a:hover { color: var(--accent); text-decoration: underline; }
  .meta { color: var(--muted); font-size: 13px; }
  .company { font-size: 14px; }
  .right { text-align: right; font-size: 13px; color: var(--muted); white-space: nowrap; }
  .tag { display: inline-block; background: var(--accent-soft); color: var(--accent);
         border-radius: 4px; padding: 1px 6px; font-size: 12px; margin-right: 4px; }
  .new { color: var(--new); font-weight: bold; }
  .empty { text-align: center; color: var(--muted); padding: 40px 0; }
  details { color: var(--muted); font-size: 13px; margin-bottom: 40px; }
  @media (max-width: 600px) {
    .job { grid-template-columns: 1fr; }
    .right { text-align: left; }
    .row > .label { width: 100%; }
  }
</style>
</head>
<body>
<header>
  <h1>GTM Radar</h1>
  <p class="sub" id="sub">Loading…</p>
</header>
<main>
  <section class="filters" aria-label="Filters">
    <div class="row"><span class="label">Function</span><span id="f-fn"></span></div>
    <div class="row"><span class="label">Seniority</span><span id="f-sen"></span></div>
    <div class="row"><span class="label">Region</span><span id="f-region"></span></div>
    <div class="row"><span class="label">Posted</span><span id="f-posted"></span></div>
    <div class="row"><span class="label">Segment</span><span id="f-seg"></span></div>
    <div class="row"><span class="label">List</span><span id="f-src"></span></div>
    <div class="row"><span class="label">Search</span>
      <input type="search" id="q" placeholder="Title or company, e.g. product marketing, Wiz">
    </div>
  </section>
  <div class="summary"><span id="count"></span><span id="updated"></span></div>
  <div class="list" id="list"></div>
  <details id="health"><summary>Company feed status</summary><div id="health-body"></div></details>
</main>

<script>
const OPTS = {
  fn:     [["marketing","Marketing"],["strategy-ops","Strategy & Ops / RevOps / CoS"]],
  sen:    [["c-level","C-level"],["vp-head","VP / Head"],["director","Director"]],
  region: [["bay-area","Bay Area"],["west-coast","West Coast"],["remote-us","Remote (US)"]],
  posted: [["1","24 hours"],["3","3 days"],["7","7 days"],["14","14 days"],["30","30 days"],["all","Any time"]],
};
// Defaults match your search: Bay Area + Remote, Director and up, last 7 days
const DEFAULTS = { fn: ["marketing","strategy-ops"], sen: ["c-level","vp-head","director"],
                   region: ["bay-area","remote-us"], posted: ["7"], seg: [], src: [] };

const params = new URLSearchParams(location.search);
const state = {};
for (const k of ["fn","sen","region","posted","seg","src"]) {
  state[k] = params.has(k) ? params.get(k).split(",").filter(Boolean) : [...DEFAULTS[k]];
}
state.q = params.get("q") || "";
document.getElementById("q").value = state.q;

let DATA = { roles: [] };

function chips(key, options, single) {
  const host = document.getElementById("f-" + key);
  host.innerHTML = "";
  for (const [val, label] of options) {
    const b = document.createElement("button");
    b.className = "chip"; b.textContent = label; b.type = "button";
    b.setAttribute("aria-pressed", state[key].includes(val));
    b.onclick = () => {
      if (single) state[key] = [val];
      else state[key] = state[key].includes(val) ? state[key].filter(v => v !== val) : [...state[key], val];
      chips(key, options, single); render();
    };
    host.appendChild(b);
  }
}

function daysAgo(iso) {
  if (!iso) return Infinity;
  return (Date.now() - new Date(iso).getTime()) / 86400000;
}
function ago(iso) {
  const d = daysAgo(iso);
  if (!isFinite(d)) return "date unknown";
  if (d < 1) return "today";
  if (d < 2) return "yesterday";
  return Math.floor(d) + " days ago";
}
function esc(s) { return String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

const LABEL = Object.fromEntries(Object.values(OPTS).flat());

function syncURL() {
  const p = new URLSearchParams();
  for (const k of ["fn","sen","region","posted","seg","src"]) if (state[k].length) p.set(k, state[k].join(","));
  if (state.q) p.set("q", state.q);
  history.replaceState(null, "", "?" + p.toString());
}

function render() {
  syncURL();
  const maxDays = state.posted[0] === "all" ? Infinity : Number(state.posted[0] || 7);
  const q = state.q.trim().toLowerCase();
  const today = DATA.generated ? DATA.generated.slice(0, 10) : "";
  const rows = DATA.roles.filter(r =>
    (!state.fn.length || state.fn.includes(r.fn)) &&
    (!state.sen.length || state.sen.includes(r.sen)) &&
    (!state.region.length || r.regions.some(x => state.region.includes(x))) &&
    (!state.seg.length || state.seg.includes(r.segment)) &&
    (!state.src.length || state.src.includes(r.source)) &&
    daysAgo(r.posted) <= maxDays &&
    (!q || (r.title + " " + r.company).toLowerCase().includes(q))
  );
  document.getElementById("count").textContent =
    rows.length + " role" + (rows.length === 1 ? "" : "s") + " at " + new Set(rows.map(r => r.company)).size + " companies";
  const list = document.getElementById("list");
  if (!rows.length) { list.innerHTML = '<p class="empty">No roles match. Try widening Posted or Region.</p>'; return; }
  list.innerHTML = rows.map(r => `
    <article class="job">
      <div>
        <a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.title)}</a>
        <div class="company">${esc(r.company)}${r.source === "tracker" ? ' <span class="tag">Tracker</span>' : ""}</div>
        <div class="meta">${esc(r.locations.join(" · "))}</div>
        <div>${r.regions.map(x => `<span class="tag">${esc(LABEL[x] || x)}</span>`).join("")}<span class="tag">${esc(LABEL[r.sen] || r.sen)}</span></div>
      </div>
      <div class="right">
        Posted ${ago(r.posted)}<br>
        ${r.first_seen === today ? '<span class="new">New today</span>' : "First seen " + esc(r.first_seen)}
      </div>
    </article>`).join("");
}

document.getElementById("q").addEventListener("input", e => { state.q = e.target.value; render(); });

fetch("jobs.json", { cache: "no-store" })
  .then(r => r.json())
  .then(d => {
    DATA = d;
    const segs = [...new Set(d.roles.map(r => r.segment).filter(Boolean))].sort();
    OPTS.seg = segs.map(s => [s, s]);
    chips("fn", OPTS.fn); chips("sen", OPTS.sen); chips("region", OPTS.region);
    chips("posted", OPTS.posted, true); chips("seg", OPTS.seg);
    OPTS.src = [["tracker","My tracker"],["broad","Broader list"]].filter(([v]) => d.status.some(s => s.source === v));
    chips("src", OPTS.src);
    document.getElementById("sub").textContent =
      `Senior GTM roles from ${d.companies_ok} of ${d.companies_tracked} tracked companies, pulled from their public hiring feeds.`;
    document.getElementById("updated").textContent = "Refreshed " + new Date(d.generated).toLocaleString();
    const bad = d.status.filter(s => !s.ok);
    document.getElementById("health-body").innerHTML =
      (bad.length ? "<p>Not reading (fix slug in companies.csv):</p><ul>" + bad.map(s => `<li>${esc(s.company)} (${esc(s.slug)}): ${esc(s.note)}</li>`).join("") + "</ul>" : "<p>All feeds OK.</p>") +
      "<p>Reading: " + d.status.filter(s => s.ok).map(s => `${esc(s.company)} (${s.ats}, ${s.open_roles} open${s.guessed ? ", auto-found" : ""})`).join(", ") + "</p>";
    render();
  })
  .catch(() => { document.getElementById("sub").textContent = "Could not load jobs.json. Run radar.py first."; });
</script>
</body>
</html>
