<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>GTM Radar</title>
<style>
  :root {
    --bg: #f7f7f5; --card: #ffffff; --ink: #1d1d1b; --muted: #6b6b66; --line: #e3e2dd;
    --accent: #0f5c4d; --accent-soft: #e2efe9; --new: #b4471b;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151514; --card: #1f1f1d; --ink: #ecebe6; --muted: #a09f98; --line: #34332f;
            --accent: #6cc3ab; --accent-soft: #1f3a33; --new: #f08a5d; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font-family: Arial, Helvetica, sans-serif; font-size: 15px; line-height: 1.45; }
  header, main { max-width: 1040px; margin: 0 auto; padding: 0 16px; }
  header { padding-top: 28px; padding-bottom: 8px; }
  h1 { font-size: 24px; margin: 0 0 4px; letter-spacing: -0.01em; }
  .sub { color: var(--muted); margin: 0; font-size: 14px; }
  .filters { background: var(--card); border: 1px solid var(--line); border-radius: 10px;
             padding: 14px 16px; margin: 16px 0; display: grid; gap: 10px; }
  .row { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 6px; }
  .row > .label { padding-top: 6px; }
  .row > .label { width: 92px; color: var(--muted); font-size: 13px; flex-shrink: 0; }
  .row > span[id] { display: flex; flex-wrap: wrap; gap: 6px; flex: 1; min-width: 0; }
  .chip { border: 1px solid var(--line); background: transparent; color: var(--ink);
          border-radius: 999px; padding: 5px 12px; font: inherit; font-size: 13px; cursor: pointer; }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--card); }
  input[type=search] { flex: 1; min-width: 180px; padding: 7px 10px; border: 1px solid var(--line);
                       border-radius: 8px; background: var(--bg); color: var(--ink); font: inherit; }
  .summary { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px;
             color: var(--muted); font-size: 13px; margin: 4px 0 10px; }
  .list { display: grid; gap: 8px; margin-bottom: 40px; }
  .job { background: var(--card); border: 1px solid var(--line); border-radius: 10px;
         padding: 12px 16px; display: grid; grid-template-columns: 1fr auto; gap: 4px 16px; }
  .job a { color: var(--ink); text-decoration: none; font-weight: bold; }
  .job a:hover { color: var(--accent); text-decoration: underline; }
  .meta { color: var(--muted); font-size: 13px; }
  .company { font-size: 14px; }
  .right { text-align: right; font-size: 13px; color: var(--muted); white-space: nowrap; }
  .tag { display: inline-block; background: var(--accent-soft); color: var(--accent);
         border-radius: 4px; padding: 1px 6px; font-size: 12px; margin-right: 4px; }
  .new { color: var(--new); font-weight: bold; }
  .chip .n { opacity: 0.7; font-size: 12px; margin-left: 2px; }
  .chip[aria-pressed="true"] .n { opacity: 0.85; }
  .more { justify-self: center; border: 1px solid var(--line); background: var(--card); color: var(--ink);
          border-radius: 8px; padding: 9px 16px; font: inherit; font-size: 14px; cursor: pointer; }
  .more:hover { border-color: var(--accent); color: var(--accent); }
  .tag + .tag { margin-left: 0; }
  .empty { text-align: center; color: var(--muted); padding: 40px 0; }
  details { color: var(--muted); font-size: 13px; margin-bottom: 16px; }
  details summary { cursor: pointer; }
  details a { color: var(--accent); }
  @media (max-width: 600px) {
    .job { grid-template-columns: 1fr; }
    .right { text-align: left; }
    .row > .label { width: 100%; }
  }
</style>
</head>
<body>
<header>
  <h1>GTM Radar</h1>
  <p class="sub" id="sub">Loading…</p>
</header>
<main>
  <section class="filters" aria-label="Filters">
    <div class="row"><span class="label">Function</span><span id="f-fn"></span></div>
    <div class="row" id="row-spec"><span class="label">Specialty</span><span id="f-spec"></span></div>
    <div class="row"><span class="label">Seniority</span><span id="f-sen"></span></div>
    <div class="row"><span class="label">Region</span><span id="f-region"></span></div>
    <div class="row"><span class="label">Posted</span><span id="f-posted"></span></div>
    <div class="row"><span class="label">Segment</span><span id="f-seg"></span></div>
    <div class="row"><span class="label">List</span><span id="f-src"></span></div>
    <div class="row"><span class="label">Search</span>
      <input type="search" id="q" placeholder="Title or company, e.g. product marketing, Wiz, chief of staff">
    </div>
  </section>
  <div class="summary"><span id="count"></span><span id="updated"></span></div>
  <div class="list" id="list"></div>
  <details id="audit"><summary id="audit-sum">Check these</summary><div id="audit-body"></div></details>
  <details id="health"><summary>Company feed status</summary><div id="health-body"></div></details>
</main>

<script>
// Fallback labels; the live list comes from jobs.json so new categories appear automatically
let FN_LABELS = {"marketing":"Marketing","strategy-ops":"Strategy & Ops / RevOps / CoS","sales":"Sales",
  "sales-engineering":"Sales Engineering","partnerships":"Partnerships","customer-success":"Customer Success & Support",
  "product":"Product","design":"Design","engineering":"Engineering","data":"Data & Analytics","it":"IT",
  "finance":"Finance","people":"People / HR / Recruiting","legal":"Legal & Compliance","operations":"Operations","other":"Other"};
let SEN_LABELS = {"c-level":"C-level","vp-head":"VP / Head","director":"Director","manager":"Manager",
  "senior-ic":"Senior / Staff / Principal IC","ic":"Individual contributor","intern":"Intern / New grad"};
const REGION_LABELS = {"bay-area":"Bay Area","west-coast":"West Coast","remote-us":"Remote (US)"};
const POSTED = [["1","24 hours"],["3","3 days"],["7","7 days"],["14","14 days"],["30","30 days"],["all","Any time"]];
const SRC_LABELS = {"tracker":"My tracker","broad":"Broader list"};
const MULTI = ["fn","spec","sen","region","seg","src"];
let SPEC_LABELS = {};
const PAGE = 100;

// Empty selection means "all". Defaults: every function and level, Bay Area + remote, last 7 days.
const DEFAULTS = { fn: [], spec: [], sen: [], region: ["bay-area","remote-us"], posted: ["7"], seg: [], src: [] };

const params = new URLSearchParams(location.search);
const state = {};
for (const k of [...MULTI, "posted"]) {
  state[k] = params.has(k) ? params.get(k).split(",").filter(Boolean) : [...DEFAULTS[k]];
}
state.q = params.get("q") || "";
document.getElementById("q").value = state.q;
let shown = PAGE;
let DATA = { roles: [] };
let SEG_LABELS = {};

// A repost counts as recent activity, so it shows up under "Posted in the last N days"
function latest(r) { return r.reposted && (!r.posted || r.reposted > r.posted.slice(0, 10)) ? r.reposted : r.posted; }
function daysAgo(iso) {
  if (!iso) return Infinity;
  return (Date.now() - new Date(iso).getTime()) / 86400000;
}
function ago(iso) {
  const d = daysAgo(iso);
  if (!isFinite(d)) return "date unknown";
  if (d < 1) return "today";
  if (d < 2) return "yesterday";
  return Math.floor(d) + " days ago";
}
function esc(s) { return String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

// Rows passing every filter except the one named in `skip` (used for the counts on each chip)
function matches(r, skip) {
  const maxDays = state.posted[0] === "all" ? Infinity : Number(state.posted[0] || 7);
  const q = state.q.trim().toLowerCase();
  return (skip === "fn" || !state.fn.length || state.fn.includes(r.fn)) &&
    (skip === "spec" || !state.spec.length || state.spec.includes(r.spec)) &&
    (skip === "sen" || !state.sen.length || state.sen.includes(r.sen)) &&
    (skip === "region" || !state.region.length || r.regions.some(x => state.region.includes(x))) &&
    (skip === "seg" || !state.seg.length || state.seg.includes(r.segment)) &&
    (skip === "src" || !state.src.length || state.src.includes(r.source)) &&
    (skip === "posted" || daysAgo(latest(r)) <= maxDays) &&
    (!q || (r.title + " " + r.company).toLowerCase().includes(q));
}

function chipRow(key, labels, single) {
  const host = document.getElementById("f-" + key);
  host.innerHTML = "";
  const counts = {};
  if (!single) {
    for (const r of DATA.roles) {
      if (!matches(r, key)) continue;
      const vals = key === "region" ? r.regions : [key === "fn" ? r.fn : key === "spec" ? r.spec : key === "sen" ? r.sen : key === "seg" ? r.segment : r.source];
      for (const v of vals) counts[v] = (counts[v] || 0) + 1;
    }
  }
  const add = (label, pressed, onclick, n) => {
    const b = document.createElement("button");
    b.className = "chip"; b.type = "button";
    b.innerHTML = esc(label) + (n !== undefined ? ` <span class="n">${n.toLocaleString()}</span>` : "");
    b.setAttribute("aria-pressed", pressed);
    b.onclick = onclick;
    host.appendChild(b);
  };
  if (!single) add("All", !state[key].length, () => { state[key] = []; update(); });
  for (const [val, label] of labels) {
    add(label, state[key].includes(val), () => {
      if (single) state[key] = [val];
      else state[key] = state[key].includes(val) ? state[key].filter(v => v !== val) : [...state[key], val];
      update();
    }, single ? undefined : (counts[val] || 0));
  }
}

function syncURL() {
  const p = new URLSearchParams();
  for (const k of [...MULTI, "posted"]) {
    // Write a filter when it differs from the default, including "All" (empty) where the default isn't
    if (state[k].join(",") !== DEFAULTS[k].join(",")) p.set(k, state[k].join(","));
  }
  if (state.q) p.set("q", state.q);
  history.replaceState(null, "", "?" + p.toString());
}

function update() { shown = PAGE; render(); }

function render() {
  syncURL();
  chipRow("fn", Object.entries(FN_LABELS));
  chipRow("spec", Object.entries(SPEC_LABELS));
  document.getElementById("row-spec").style.display = Object.keys(SPEC_LABELS).length ? "" : "none";
  chipRow("sen", Object.entries(SEN_LABELS));
  chipRow("region", Object.entries(REGION_LABELS));
  chipRow("posted", POSTED, true);
  chipRow("seg", Object.entries(SEG_LABELS));
  chipRow("src", Object.entries(SRC_LABELS).filter(([v]) => DATA.status && DATA.status.some(s => s.source === v)));

  const today = DATA.generated ? DATA.generated.slice(0, 10) : "";
  const rows = DATA.roles.filter(r => matches(r));
  document.getElementById("count").textContent =
    rows.length.toLocaleString() + " role" + (rows.length === 1 ? "" : "s") + " at " +
    new Set(rows.map(r => r.company)).size + " companies";
  const list = document.getElementById("list");
  if (!rows.length) { list.innerHTML = '<p class="empty">No roles match. Try widening Posted or Region.</p>'; return; }
  list.innerHTML = rows.slice(0, shown).map(r => `
    <article class="job">
      <div>
        <a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.title)}</a>
        <div class="company">${esc(r.company)}${r.source === "tracker" ? ' <span class="tag">Tracker</span>' : ""}</div>
        <div class="meta">${esc(r.locations.join(" · "))}</div>
        <div>${r.regions.map(x => `<span class="tag">${esc(REGION_LABELS[x] || x)}</span>`).join("")}<span class="tag">${esc(SEN_LABELS[r.sen] || r.sen)}</span><span class="tag">${esc(r.spec || FN_LABELS[r.fn] || r.fn)}</span></div>
      </div>
      <div class="right">
        Posted ${ago(r.posted)}<br>
        ${r.reposted ? `<span class="new">Reposted ${r.reposted === today ? "today" : esc(r.reposted)}</span><br>` : ""}
        ${r.first_seen === today && !r.reposted ? '<span class="new">New today</span>' : r.first_seen === today ? "" : "First seen " + esc(r.first_seen)}
      </div>
    </article>`).join("") +
    (rows.length > shown ? `<button class="more" type="button" id="more">Show ${Math.min(PAGE, rows.length - shown)} more of ${(rows.length - shown).toLocaleString()} remaining</button>` : "");
  const more = document.getElementById("more");
  if (more) more.onclick = () => { shown += PAGE; render(); };
}

let typing;
document.getElementById("q").addEventListener("input", e => {
  state.q = e.target.value;
  clearTimeout(typing); typing = setTimeout(update, 150);
});

fetch("jobs.json", { cache: "no-store" })
  .then(r => r.json())
  .then(d => {
    DATA = d;
    if (d.functions) FN_LABELS = d.functions;
    if (d.seniorities) SEN_LABELS = d.seniorities;
    // Older data files (before every function was tracked) have no fn/sen on some roles
    for (const r of d.roles) { r.fn = r.fn || "other"; r.sen = r.sen || "ic"; }
    const specs = [...new Set(d.roles.map(r => r.spec).filter(Boolean))].sort();
    SPEC_LABELS = Object.fromEntries(specs.map(s => [s, s]));
    const segs = [...new Set(d.roles.map(r => r.segment).filter(Boolean))].sort();
    SEG_LABELS = Object.fromEntries(segs.map(s => [s, s]));
    document.getElementById("sub").textContent =
      `Open roles from ${d.companies_ok} of ${d.companies_tracked} tracked companies, pulled from their public hiring feeds.`;
    document.getElementById("updated").textContent = "Refreshed " + new Date(d.generated).toLocaleString();
    // Completeness check: roles the radar found but couldn't place, and searches that hit their limit
    const unplaced = d.unplaced || [];
    const capped = d.status.filter(s => s.ok && s.note && s.note.startsWith("search limit"));
    const missing = d.status.filter(s => !s.ok);
    document.getElementById("audit-sum").textContent =
      `Check these: ${unplaced.length} senior roles couldn't be placed, ${capped.length} companies hit the search limit, ${missing.length} companies not readable`;
    document.getElementById("audit-body").innerHTML =
      (unplaced.length ? "<p><b>Senior roles found but not placed in Bay Area / West Coast / Remote (US)</b>, usually because the location text has no city. Open to check:</p><ul>" +
        unplaced.map(u => `<li><a href="${esc(u.url)}" target="_blank" rel="noopener">${esc(u.company)}: ${esc(u.title)}</a> (${esc(u.locations.join(" · ") || "no location")}; ${esc(u.why || "")})</li>`).join("") + "</ul>" : "<p>No unplaced senior roles.</p>") +
      (capped.length ? "<p><b>Search limit reached</b> (some roles at these companies may be missing):</p><ul>" +
        capped.map(s => `<li>${esc(s.company)}: ${esc(s.note)}</li>`).join("") + "</ul>" : "");
    const bad = missing;
    document.getElementById("health-body").innerHTML =
      (bad.length ? "<p>Not reading (add a job link in companies.csv):</p><ul>" + bad.map(s => `<li>${esc(s.company)}${s.slug ? " (" + esc(s.slug) + ")" : ""}: ${esc(s.note)}</li>`).join("") + "</ul>" : "<p>All feeds OK.</p>") +
      "<p>Reading: " + d.status.filter(s => s.ok).map(s => `${esc(s.company)} (${s.ats}, ${s.open_roles} open${s.guessed ? ", auto-found" : ""})`).join(", ") + "</p>";
    render();
  })
  .catch(() => { document.getElementById("sub").textContent = "Could not load jobs.json. Run radar.py first."; });
</script>
</body>
</html>
